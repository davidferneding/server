apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-data
  namespace: server
  labels:
    app.kubernetes.io/name: matter
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter
  namespace: server
  labels:
    app.kubernetes.io/name: matter
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: server
    spec:
      hostNetwork: true
      dnsPolicy: Default
      nodeSelector:
        server.d-f.dev/node-role: home
      tolerations:
        - key: server.d-f.dev/node-role
          operator: Equal
          value: home
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
      containers:
        - name: matter
          image: ghcr.io/matter-js/matterjs-server:1.5.5
          ports:
            - containerPort: 5580
          env:
            - name: STORAGE_PATH
              value: /data
            - name: PORT
              value: "5580"
            - name: LOG_LEVEL
              value: info
            - name: TZ
              value: Europe/Berlin
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: NOBLE_BINDINGS
              value: dbus
            - name: BLUETOOTH_ADAPTER
              value: "0"
          volumeMounts:
            - name: matter-data
              mountPath: /data
            - name: dbus
              mountPath: /run/dbus
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 5580
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5580
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: matter-data
          persistentVolumeClaim:
            claimName: matter-data
        - name: dbus
          hostPath:
            path: /run/dbus
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: matter
  namespace: server
  labels:
    app.kubernetes.io/name: matter
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: matter
  ports:
    - port: 5580
      targetPort: 5580
