apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-storage
  namespace: server
  labels:
    app.kubernetes.io/name: affine
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-config
  namespace: server
  labels:
    app.kubernetes.io/name: affine
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: affine-config
  namespace: server
  labels:
    app.kubernetes.io/name: affine
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: server
data:
  REDIS_SERVER_HOST: "redis"
  REDIS_SERVER_DATABASE: "5"
  AFFINE_INDEXER_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: affine-server-config
  namespace: server
  labels:
    app.kubernetes.io/name: affine
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: server
data:
  config.json: |
    {
      "server": {
        "name": "Notes",
        "externalUrl": "https://notes.d-f.dev",
        "https": true
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: server
  labels:
    app.kubernetes.io/name: affine
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: affine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: affine
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: server
    spec:
      initContainers:
        - name: affine-migration
          image: ghcr.io/toeverything/affine:0.27.4
          command: ["sh", "-c", "node ./scripts/self-host-predeploy.js"]
          envFrom:
            - configMapRef:
                name: affine-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: affine-storage
              mountPath: /root/.affine/storage
            - name: affine-config
              mountPath: /root/.affine/config
            - name: affine-server-config
              mountPath: /root/.affine/config/config.json
              subPath: config.json
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:0.27.4
          ports:
            - containerPort: 3010
          envFrom:
            - configMapRef:
                name: affine-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: affine-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: affine-storage
              mountPath: /root/.affine/storage
            - name: affine-config
              mountPath: /root/.affine/config
            - name: affine-server-config
              mountPath: /root/.affine/config/config.json
              subPath: config.json
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: 3010
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3010
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: affine-storage
          persistentVolumeClaim:
            claimName: affine-storage
        - name: affine-config
          persistentVolumeClaim:
            claimName: affine-config
        - name: affine-server-config
          configMap:
            name: affine-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: server
  labels:
    app.kubernetes.io/name: affine
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: affine
  ports:
    - port: 3010
      targetPort: 3010
