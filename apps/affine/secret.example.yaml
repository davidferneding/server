apiVersion: v1
kind: Secret
metadata:
  name: affine-secret
  namespace: server
  labels:
    app.kubernetes.io/name: affine
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: server
stringData:
  # Must match AFFINE_DB_PASSWORD in postgresql-secret. Use only URL-safe
  # characters, or URL-encode the password inside this URL.
  DATABASE_URL: "postgresql://affine:change-me-affine@postgresql:5432/affine"
